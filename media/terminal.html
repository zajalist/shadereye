<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shadereye session</title>
<style>
  /* GAEAMCP cinematic dark - warm amber accent, slate panels, calm + refined. */
  :root{
    --bg-deep:#1b1e24; --bg-base:#22262e; --bg-panel:#2a2e36;
    --bg-raised:#303540; --bg-elevated:#353a45;
    --border-soft:#3d434e; --border-mid:#2f343d;
    --accent:#B56A1D; --accent-dim:#B56A1D22;
    --text:#e5e8eb; --text-2:#a8aeb8; --text-3:#6b7280;
    --green:#4db38a; --red:#e06464;
    --ui:'Segoe UI','Noto Sans',system-ui,-apple-system,sans-serif;
    --mono:'Consolas','Noto Sans Mono','Liberation Mono',monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-deep);color:var(--text)}
  body{
    min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    padding:46px 0;font-family:var(--ui);line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(820px 460px at 50% -6%, rgba(181,106,29,.06), transparent 70%),
      var(--bg-deep);
  }
  .panel{
    width:860px;height:528px;background:var(--bg-panel);
    border:1px solid var(--border-mid);border-radius:8px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .panel.full{height:auto;display:block}
  .head{
    flex:0 0 auto;
    display:flex;align-items:center;gap:16px;
    padding:18px 24px;border-bottom:1px solid var(--border-mid);
    background:var(--bg-base);
  }
  .logo{width:18px;height:18px;flex:none;display:block}
  .brand{font-family:var(--ui);font-weight:600;font-size:15px;
          letter-spacing:-.01em;color:var(--text)}
  .brand b{color:var(--accent);font-weight:600}
  .head .sep{width:1px;height:15px;background:var(--border-soft)}
  .eyebrow{
    font-size:10.5px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent)
  }
  .head .right{
    margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--text-3)
  }
  #log{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;
        padding:22px 26px 28px;font-family:var(--mono);
        font-size:13px;line-height:1.85;color:var(--text-2)}
  #log::-webkit-scrollbar{width:0;height:0;display:none}
  .panel.full #log{overflow:visible;flex:none;scroll-behavior:auto}
  .row{margin:0;padding:5px 0;white-space:pre-wrap;word-break:break-word;
       opacity:0;transform:translateY(6px);
       animation:in .5s var(--ease) forwards}
  @keyframes in{to{opacity:1;transform:none}}

  .who{
    display:inline-block;font-family:var(--ui);font-size:10px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);
    margin-right:14px;vertical-align:1px
  }
  .who.agent{color:var(--accent)}
  .say{color:var(--text)}
  .say .code{color:var(--accent);font-weight:600}

  .tool{
    margin:10px 0;padding:12px 16px;background:var(--bg-base);
    border:1px solid var(--border-mid);border-left:2px solid var(--border-soft);
    border-radius:4px
  }
  .tool .lbl{
    display:block;font-family:var(--ui);font-size:9.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);
    margin-bottom:6px
  }
  .tool .fn{color:var(--accent);font-weight:600}
  .tool .arg{color:var(--text-3)}

  .note{
    margin:10px 0;padding:13px 16px;background:var(--bg-base);
    border:1px solid var(--border-mid);border-radius:4px
  }
  .note .k{
    display:block;font-family:var(--ui);font-size:10px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    margin-bottom:6px
  }
  .note .v{color:var(--text-2)}

  .diff{display:block;padding:5px 14px;border:1px solid var(--border-mid);
        border-top:none}
  .diff.first{border-top:1px solid var(--border-mid);
        border-radius:4px 4px 0 0;margin-top:10px}
  .diff.last{border-radius:0 0 4px 4px}
  .diff.del{color:#d98a86;background:rgba(224,100,100,.07)}
  .diff.add{color:#7fc8a6;background:rgba(77,179,138,.07)}
  .diff .g{color:var(--text-3);user-select:none}

  figure.view{margin:14px 0 6px;width:248px}
  .vlabel{
    display:block;font-family:var(--ui);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--text-3);margin-bottom:8px
  }
  .frame{
    position:relative;border:1px solid var(--border-mid);
    border-radius:3px;padding:9px;background:var(--bg-base)
  }
  .frame.live{border-color:rgba(181,106,29,.4)}
  .frame img{display:block;width:100%;height:auto;border-radius:2px;background:#000}
  .pill{
    position:absolute;top:-9px;right:12px;font-family:var(--ui);
    font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:2px 9px;border-radius:10px;border:1px solid
  }
  .pill.fail{background:rgba(224,100,100,.16);color:var(--red);border-color:var(--red)}
  .pill.pass{background:rgba(77,179,138,.16);color:var(--green);border-color:var(--green)}
  figcaption{margin-top:9px;font-family:var(--ui);font-size:12px;color:var(--text-3)}

  .done{
    display:flex;align-items:center;gap:14px;margin-top:12px;
    padding:13px 18px;background:var(--bg-base);
    border:1px solid var(--border-mid);border-left:2px solid var(--accent);
    border-radius:4px
  }
  .done b{
    font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent)
  }
  .done span{color:var(--text-3);font-family:var(--ui);font-size:12.5px}

  .cursor{display:inline-block;width:7px;height:14px;margin-left:2px;
    background:var(--accent);vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <svg class="logo" viewBox="0 0 24 24" fill="none">
      <rect x="2.5" y="2.5" width="19" height="19" rx="3" stroke="#B56A1D" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="4.4" stroke="#B56A1D" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="1.5" fill="#B56A1D"/>
    </svg>
    <span class="brand">shader<b>eye</b></span>
    <span class="sep"></span>
    <span class="eyebrow">shader&nbsp;mcp</span>
    <span class="right">session</span>
  </div>
  <div id="log"></div>
</div>
<script>
// Accurate to the real tool surface (render_shader, lookup_reference) and the
// bundled gotcha note. Generic agent; no vendor branding.
var STEPS=[
 {t:140,type:'line',html:'<span class="who">user</span><span class="say">the swirl in examples/swirl.glsl renders as a flat wash, not the pattern. fix it</span>'},
 {t:340,type:'line',html:'<span class="who agent">agent</span><span class="say">Rendering it to see the current output.</span>'},
 {t:220,type:'block',html:'<div class="tool"><span class="lbl">tool call</span><span class="fn">render_shader</span> <span class="arg">source=examples/swirl.glsl &nbsp;size=320x320 &nbsp;t=1.4</span></div>'},
 {t:340,type:'block',html:'<figure class="view"><span class="vlabel">output / swirl.glsl</span><div class="frame"><span class="pill fail">fail</span><img src="swirl_broken_thumb.png" alt="broken"></div><figcaption>flat colour wash, every wave term collapses to zero</figcaption></figure>'},
 {t:300,type:'line',html:'<span class="who agent">agent</span><span class="say">The waves vanish. <span class="code">float amp = 1 / 2;</span> looks wrong, checking the reference.</span>'},
 {t:220,type:'block',html:'<div class="tool"><span class="lbl">tool call</span><span class="fn">lookup_reference</span> <span class="arg">"integer division"</span></div>'},
 {t:340,type:'block',html:'<div class="note"><span class="k">integer-division</span><span class="v">In GLSL, 1/2 == 0 (integer division). Use 1.0/2.0 for float results.</span></div>'},
 {t:300,type:'line',html:'<span class="who agent">agent</span><span class="say">Confirmed. <span class="code">1 / 2</span> is 0, so <span class="code">amp</span> zeroes every term. Patching to float division.</span>'},
 {t:220,type:'block',html:'<span class="diff del first"><span class="g">- </span>float amp = 1 / 2;</span>'},
 {t:200,type:'block',html:'<span class="diff add last"><span class="g">+ </span>float amp = 1.0 / 2.0;</span>'},
 {t:260,type:'block',html:'<div class="tool"><span class="lbl">tool call</span><span class="fn">render_shader</span> <span class="arg">source=examples/swirl.glsl &nbsp;size=320x320 &nbsp;t=1.4</span></div>'},
 {t:360,type:'block',html:'<figure class="view"><span class="vlabel">output / swirl.glsl</span><div class="frame live"><span class="pill pass">pass</span><img src="swirl_fixed_thumb.png" alt="fixed"></div><figcaption>swirl restored, full plasma pattern</figcaption></figure>'},
 {t:300,type:'block',html:'<div class="done"><b>resolved</b><span>integer division replaced with float division; pattern restored.</span></div>'}
];
var log=document.getElementById('log');
// Keep the newest message in view: the panel is a fixed rectangle, the log
// scrolls so the latest content is always pinned to the bottom.
function sd(){log.scrollTop=log.scrollHeight;}
function typeLine(html,done){
  var tmp=document.createElement('div');tmp.innerHTML=html;
  var plain=tmp.textContent;
  var el=document.createElement('div');el.className='row';
  el.style.animation='none';el.style.opacity='1';el.style.transform='none';
  log.appendChild(el);sd();
  var cur=document.createElement('span');cur.className='cursor';el.appendChild(cur);
  var i=0,speed=Math.max(7,Math.min(15,520/plain.length));
  (function tick(){
    if(i<=plain.length){cur.insertAdjacentText('beforebegin',plain.charAt(i-1)||'');i++;sd();setTimeout(tick,speed);}
    else{el.innerHTML=html;sd();done();}
  })();
}
function revealBlock(html,done){
  var el=document.createElement('div');el.className='row';el.innerHTML=html;
  log.appendChild(el);sd();
  // image rows grow after the embedded thumbnail loads — re-pin on load.
  var im=el.querySelector('img');
  if(im&&!im.complete){im.addEventListener('load',sd);im.addEventListener('error',sd);}
  setTimeout(function(){sd();done();},130);
}
var idx=0;
function run(){
  if(idx>=STEPS.length)return;
  var s=STEPS[idx++];
  setTimeout(function(){ (s.type==='line'?typeLine:revealBlock)(s.html,run); }, s.t);
}
function renderStatic(n){
  var steps=(n==null)?STEPS:STEPS.slice(0,n);
  steps.forEach(function(s){
    var el=document.createElement('div');el.className='row';
    el.style.animation='none';el.style.opacity='1';el.style.transform='none';
    el.innerHTML=s.html;log.appendChild(el);
  });
  if(n!=null&&n<STEPS.length){
    var last=log.lastElementChild;
    if(last){var cur=document.createElement('span');cur.className='cursor';last.appendChild(cur);}
  }
  sd();
}
function start(){
  var panel=document.querySelector('.panel');
  var stepsParam=new URLSearchParams(location.search).get('steps');
  if(stepsParam!==null){
    var n=Math.max(0,Math.min(STEPS.length,parseInt(stepsParam,10)||0));
    renderStatic(n);
    // wait for any thumbnail to load, then pin to bottom for the captured frame
    var im=log.querySelector('img');
    if(im&&!im.complete){im.addEventListener('load',sd);}
    sd();return;
  }
  if(location.hash==='#static'){panel.classList.add('full');renderStatic();return;}
  setTimeout(run,500);
}
if(document.fonts&&document.fonts.ready){
  var to=setTimeout(start,1200);
  document.fonts.ready.then(function(){clearTimeout(to);start();});
}else{window.addEventListener('load',start);}
</script>
</body>
</html>
